name: Build & Release Eyeline APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Optional release tag (e.g. v3.0) to publish a GitHub Release'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Djava.awt.headless=true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Resolve version tag and signing mode
        id: config
        env:
          HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.tag_name }}" ]]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="v-dev-${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [[ "${HAS_RELEASE_KEYSTORE}" == "true" ]]; then
            echo "build_type=release" >> "$GITHUB_OUTPUT"
          else
            echo "build_type=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -f "debug.keystore.base64" ]]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          fi
          if [[ "${{ steps.config.outputs.build_type }}" == "release" ]]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/upload-key.jks"
            echo "KEYSTORE_PATH=${RUNNER_TEMP}/upload-key.jks" >> "$GITHUB_ENV"
          fi

      - name: Run JVM unit tests
        run: gradle :app:testDebugUnitTest --tests "com.example.ExampleUnitTest" --no-daemon --stacktrace

      - name: Build Signed Release APK
        if: steps.config.outputs.build_type == 'release'
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace
          mkdir -p release_out
          cp app/build/outputs/apk/release/app-release.apk "release_out/Eyeline-${{ steps.config.outputs.tag }}.apk"

      - name: Build Installable APK (default debug signing)
        if: steps.config.outputs.build_type == 'debug'
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace
          mkdir -p release_out
          cp app/build/outputs/apk/debug/app-debug.apk "release_out/Eyeline-${{ steps.config.outputs.tag }}.apk"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v6
        with:
          name: Eyeline-${{ steps.config.outputs.tag }}-apk
          path: release_out/*.apk

      - name: Publish GitHub Release with APK
        if: github.ref_type == 'tag' || inputs.tag_name != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.config.outputs.tag }}
          name: Eyeline ${{ steps.config.outputs.tag }}
          generate_release_notes: true
          files: release_out/*.apk
